# Address vim mode switching delay
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Increase tmux messages display duration
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often
set -g status-interval 5

# open first window at index 8
set -g base-index 8

# -n = no prefix, just bind directly to Meta+key (Option+key on mac)

# open new pane in CWD
bind -n M-Enter split-window -h -c "#{pane_current_path}"

# close pane
bind -n M-Bspace kill-pane

# toggle maximising pane
bind -n M-m resize-pane -Z

# create and/or select to window
bind -n M-6 run "tmux select-window -t :6 || tmux new-window -t :6 -n 6"
bind -n M-7 run "tmux select-window -t :7 || tmux new-window -t :7 -n 7"
bind -n M-8 run "tmux select-window -t :8 || tmux new-window -t :8 -n 8"
bind -n M-9 run "tmux select-window -t :9 || tmux new-window -t :9 -n 9"
bind -n M-0 run "tmux select-window -t :10 || tmux new-window -t :10 -n 10"

# select panes
bind -n M-h select-pane -L 
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# move panes
bind -n M-H swap-pane -D \; select-layout even-horizontal
bind -n M-J swap-pane -D \; select-layout even-vertical
bind -n M-K swap-pane -U \; select-layout even-vertical
bind -n M-L swap-pane -U \; select-layout even-horizontal
bind -n M-^ move-pane -d -t :6
bind -n M-& move-pane -d -t :7
bind -n M-* move-pane -d -t :8
bind -n M-( move-pane -d -t :9
bind -n M-) move-pane -d -t :10

# no status-left
set -g status-left ""

# change status bar color in maximised mode
set -g status-style 'bg=#{?#{==:#{window_zoomed_flag},1},black,white},fg=#{?#{==:#{window_zoomed_flag},1},white,black}'

# no status right
set -g status-right ""

# make current window marker clearer
set -g window-status-format "    #I    "
set -g window-status-current-format "#[bg=#{?#{==:#{window_zoomed_flag},1},white,black},fg=#{?#{==:#{window_zoomed_flag},1},black,white}]    #I    #[default]"

# enable vi scrollback mode, prefix+v(i-mode) to enter, q to exit
set -g mode-keys vi
set -g mode-style "bg=white,fg=black"
bind -n M-v copy-mode
bind -n M-p paste-buffer
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe "pbcopy"
bind -T copy-mode-vi J send-keys j j j j j j j j j j
bind -T copy-mode-vi K send-keys k k k k k k k k k k
